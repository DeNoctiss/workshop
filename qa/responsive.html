<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Проверка адаптивности мастерской</title><style>body{margin:0;background:#e6e9ee;font:14px sans-serif;padding:16px}form{display:flex;gap:12px;align-items:center;margin-bottom:16px}input{font:inherit;padding:10px;width:480px}button{font:inherit;padding:10px}.views{display:flex;gap:24px;align-items:flex-start}iframe{border:1px solid #bbc4d1;height:820px;background:white;display:block}h2{font-size:16px}</style></head><body><form><label>Маршрут <input name="route" value="/catalog"></label><button>Показать</button></form><div class="views"><section><h2>390 px</h2><iframe title="Mobile 390" width="390"></iframe></section><section><h2>768 px</h2><iframe title="Tablet 768" width="768"></iframe></section></div><script>const form=document.querySelector('form');function show(route){if(!route.startsWith('/'))return;document.querySelectorAll('iframe').forEach(f=>f.src='/#'+route)}form.addEventListener('submit',e=>{e.preventDefault();show(form.elements.route.value)});show('/catalog');</script></body></html>
